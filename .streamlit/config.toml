[server]
headless = true
enableCORS = false
enableXsrfProtection = true
maxUploadSize = 5

[browser]
gatherUsageStats = false

[theme]
base = "dark"
primaryColor = "#b48cff"
backgroundColor = "#0f0c19"
secondaryBackgroundColor = "#18132a"
textColor = "#ece4ff"
borderColor = "#2c2447"
dataframeBorderColor = "#2c2447"
baseRadius = "0.75rem"
showWidgetBorder = true
font = "sans serif"
