[project]
name = "poltergeist-panel"
version = "0.1.0"
description = "The control room for a Poltergeist Geometry Dash server."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "RealistikDash" }]
requires-python = ">=3.14"
dependencies = [
    "altair>=6.2.2",
    "gdformat>=0.2.1",
    "pandas>=3.0.5",
    "poltergeist-core",
    "python-json-logger>=4.2.0",
    "streamlit>=1.63.0",
]

[dependency-groups]
dev = [
    "mypy>=1.19",
    "pandas-stubs>=2.3",
    "pre-commit>=4",
    "ruff>=0.14",
]

[tool.ruff]
line-length = 88
target-version = "py314"

[tool.ruff.lint]
select = ["A", "B", "C4", "E", "F", "I", "N", "PERF", "RUF", "SIM", "TID", "UP", "W"]
ignore = ["RUF012"]

[tool.ruff.lint.isort]
force-single-line = true

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "parents"

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
# The stylesheet is markup held in a string; its lines are not Python.
"panel/theme.py" = ["E501"]

[tool.mypy]
strict = true
warn_unreachable = true
implicit_reexport = true
plugins = ["pydantic.mypy"]

# Altair's chaining API returns partially typed values.
[[tool.mypy.overrides]]
module = ["panel.charts"]
warn_return_any = false
disallow_untyped_calls = false

[tool.uv.sources]
poltergeist-core = { git = "https://github.com/RealistikGDPS/poltergeist-core" }
